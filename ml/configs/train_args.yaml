# 探海灵眸 SeaSight — 训练超参数配置
#
# 与 seasight.yaml（数据集定义）分离：
# 数据集配置跟数据走，超参配置跟实验走。
# 这样换数据集不用重写超参，做消融实验也只改这一份。

# ---------- 基础 ----------
model: yolo11s.pt          # 小数据集用 s 而非 n：n 在海上小目标召回不足
imgsz: 640                 # 泡沫碎片在 1080p 下只有几十像素，分辨率不能压
epochs: 100
batch: 16                  # 8GB 显存下 640 分辨率的稳妥值
workers: 4                 # Windows 上再高容易卡在数据加载
device: 0                  # CPU 填 "cpu"

# ---------- 优化器 ----------
# AdamW 在小数据集上比 SGD 收敛更稳；大 epoch 场景 SGD 更好
optimizer: AdamW
lr0: 0.001                 # 初始学习率（AdamW 比 SGD 小一个量级）
lrf: 0.01                  # 最终学习率 = lr0 * lrf
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
cos_lr: true               # 余弦退火，小数据集上比阶梯下降更平滑

# ---------- 损失权重 ----------
box: 7.5
cls: 0.5
dfl: 1.5

# ---------- 数据增强 ----------
# ★ 海上场景的关键判断：增强要贴合真实水域，而不是照搬通用配置
hsv_h: 0.015              # 色调：海面早晚光色变化
hsv_s: 0.7
hsv_v: 0.4                # 亮度：逆光/阴天/正午差异极大，必须给足
degrees: 5.0              # 旋转：摄像头基本固定，小幅即可
translate: 0.1
scale: 0.5                # 尺度：无人机与岸基距离差异大
shear: 2.0
perspective: 0.0          # 水面是平面，透视变换收益低
flipud: 0.0               # ★ 禁用上下翻转：倒影会让模型学到错误特征
fliplr: 0.5
mosaic: 1.0
mixup: 0.0                # 禁用：垃圾与海面混合会产生不真实的纹理
copy_paste: 0.0
erasing: 0.2              # 随机擦除：模拟垃圾被浪遮挡

# ---------- 训练控制 ----------
patience: 25              # 早停：验证集 25 轮无提升就停
save_period: 10
close_mosaic: 15          # ★ 最后 15 轮关闭 mosaic：让模型适应真实分布
val: true
plots: true
deterministic: false      # 打开会显著变慢，备赛不必要

# ---------- 两阶段训练 ----------
two_stage:
  enabled: true
  # 阶段一：冻结主干，只训检测头。
  # 小数据集直接全量训练会让随机初始化的 head 用噪声梯度污染预训练主干。
  stage1:
    freeze: 10            # 冻结前 10 层（主干）
    epochs: 15
    lr0: 0.001
  # 阶段二：解冻全量微调
  stage2:
    freeze: 0
    epochs: 85
    lr0: 0.0003           # 更小的学习率，避免破坏已学到的特征

# ---------- 导出 ----------
export:
  format: onnx
  imgsz: 640
  opset: 17               # ONNX Runtime 1.20 与 TensorRT 都支持
  simplify: true
  dynamic: false          # 固定 batch=1，边缘端不需要动态轴
  nms: false              # ★ NMS 放推理侧做，便于调阈值
  half: false             # FP16 在 ONNX 上有算子兼容风险，交给 TensorRT 做

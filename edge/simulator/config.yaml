    name: "马鼻码头摄像头"
    device_type: "shore_camera"
    lng: 119.6521
    lat: 26.3864
    # 该点位的主打垃圾类别与出现频率（贴合连江养殖区实际）
    profile:
      foam: 0.42          # EPS 泡沫浮球碎片 —— 当地最突出
      plastic: 0.24
      fishing_gear: 0.22
      other: 0.12
    # 事件产生速率倍率（码头人流大，垃圾多）
    rate: 1.6


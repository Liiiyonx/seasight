# ============================================================
# Oceanus 机械臂智能拾取子系统 · 统一配置（edge/grasp）
# ============================================================
# 覆盖三个组件：
#   1. vision_driver  —— 视觉驱动（ArmDriver 实现，注册名 oceanus_vision）
#   2. vision/        —— 现场再训练管线（数据集 / 训练 / 评估 / 原子部署）
#   3. web/           —— 树莓派上的训练作业台（FastAPI :8090）
#
# 设备口径与 edge/arm_bridge/config.yaml 保持一致：
#   site_id = lianjiang，device_id = RBT-ARM-01
# ★ 标记「需真机核对」的字段来自厂商源码推断，上真机前必须实测确认。

site_id: "lianjiang"
device_id: "RBT-ARM-01"

web:
  host: "0.0.0.0"
  port: 8090
  # mock=true 时不需要 ROS：用合成画面 + 模拟舵机把 UI 跑通，
  # 便于在演示笔记本上开发调试（命令行 --mock 可覆盖）。
  mock: false

arm:
  # ---------- 舵机 ID 映射（依据厂商源码核对）----------
  #   ID1 夹爪：**脉宽越大越闭**（warehouse/in.py：夹住 450、松开 75；
  #            Sensor/AIColorsorting.py 注释：张开 = servo1-280、闭合 = servo1）
  #   ID2 腕部旋转：500 为中位（in.py 用 500 + F*gripper_rotation 对齐夹取角）
  #   ID3-6 逆运动学解算的四个关节（ROS 版 kinematics.ArmIK 返回 servo3..servo6）
  gripper_servo: 1
  wrist_servo: 2
  ik_servos: [3, 4, 5, 6]
  # 开合脉宽：默认取保守的 开 200 / 闭 450（薄膜袋通常夹不到 450 就停，
  # 由 gripper_close_adaptive 的回读停滞判定收住）。厂商用过的组合：
  #   75/450（in.py 袋/块）、220/500（AIColorsorting）、150/450（ApriltagStacking）
  gripper_open: 200
  gripper_close: 450
  # 夹爪自适应渐闭：每步脉宽与步间等待（秒）；方向由 open/close 大小自动决定
  gripper_step: 20
  gripper_step_wait: 0.12
  wrist_center: 500
  default_duration_ms: 800
  # 控制话题（与厂商节点共用的同一份 ROS 契约；已按源码核对）
  #   hiwonder_servo_serialproxy 订阅 multi_id_pos_dur、发布 servo_states
  servo_topic: "/servo_controllers/port_id_1/multi_id_pos_dur"
  servo_states_topic: "/servo_controllers/port_id_1/servo_states"
  joint_states_topic: "/joint_states"
  camera_topic: "/usb_cam/image_raw"
  # ★ 水面/台面高度（绝对 z，m；原点 = 臂座安装面，与厂商 IK 的「云台中心
  #   在地面的投影」同口径）。厂商桌面抓取用 z=0.01~0.015，因为台面≈原点平面。
  #   **船上不是这样**：甲板高于水面，水面 z 应为负值（例：甲板高出水面 8cm
  #   → plane_z ≈ -0.08）。这个值不准，爪子就压不到袋子。留空 = 用标定文件里的值
  #   （或 0.02），也可以在作业台「5 · 9 点标定」里直接填。
  plane_z: null
  # ★ USB/UVC 摄像头帧源（开发机 / 无 ROS 联调）。填了就用它，**不再接 ROS 相机
  #   话题**。与 mock 分离：mock 管执行端（舵机），这里只管帧源 ——
  #   所以「真摄像头画面 + 模拟舵机」可行。真机留空（走 camera_topic）。
  #   命令行等价写法：`python -m grasp.web.server --mock --camera 0`
  usb_camera: null
  # ★ 远端执行端（作业台跑在开发机、机械臂挂在树莓派上时用）。
  #   enabled=true 时执行端不再走本机 ROS，而是连板上代理
  #   （edge/grasp/deploy/board_agent.py，python2.7 + ROS，TCP 默认 8093）。
  #   此时**本机不需要 ROS**：画面走板上 `usb_cam` 话题、舵机下发与回读都过这条连接。
  #   host 是树莓派热点地址；也支持环境变量 OCEANUS_ARM_HOST / OCEANUS_ARM_PORT。
  #   ⚠️ 板上跑代理时不要在本机再开一个直连 ROS 的作业台 —— 两条链路会同时驱臂。
  remote:
    enabled: true
    host: "192.168.149.1"
    port: 8093
    timeout: 30.0          # 单条请求超时（s）；夹爪渐闭最长约 3s，留足余量
    frame_period: 0.12     # 取帧间隔（s），约 8fps，与板上相机话题同量级
    frame_width: 640       # 板端缩放到这个宽度再传（原图 640×480 时不动）
    frame_quality: 70      # 板端 JPEG 质量
  # 待命位（取自厂商 face.py initMove：坐标 m，俯仰角 -65°，范围 [-180, 0]）
  home:
    coord: [0.0, 0.17, 0.30]
    pitch: -65
    pitch_range: [-180, 0]

vision:
  # NCNN / ONNX 模型目录（由 vision/deploy.py 原子切换）
  model_dir: "models/active"
  # ★ 部署尺寸：与导出的 ONNX 输入边长必须一致，否则 cv2.dnn 会报维度不匹配。
  #   416 → 640 是实测出来的硬结论（不是折中取整）：训练本来是 768，当年却导了 416，
  #   白丢了近半分辨率 —— 在演示场景域（仿真海面）上 416 几乎全盲（帧级命中 11/160，
  #   R@0.5 0.021），640 起才稳定出框；公开基准 AP50 也从 0.306 → 0.402。
  #   ⚠️ Pi4 上 640 会更慢，真机视觉伺服 ~4Hz 的实时性需现场复核，不保则回退 416。
  input_size: 640
  # ★ 阈值口径（tools/eval_robustness.py + _work 实测选定，不是拍脑袋）：
  #   域内微调后模型 v20261015_190359 在演示场景域 conf=0.50 → P 1.000 / R 0.836。
  #   机械臂场景「误抓代价高」，取 0.50 作平衡点。
  #   另有两道决策层兜底：grasp_loop 的连续 3 帧锁定（滤偶发误检）
  #   + HSV 饱和度校验（滤高饱和物体）。
  #
  #   ⚠ 0.35 这个工作点原本是为**域外的室内地面房间**临时下调的：0.50 下真袋子
  #   只有 1/5 帧能过阈，`lock_min_hits=3` 永远凑不满，抓取连续 3 次全败。
  #   那是"用一个没特化过的模型去撞域外场景"的补救，不是常态。
  #
  #   ★ 当前部署模型 v20261018_115111（合成泳池域 + TACO 真实照片 replay 混采，2 类，@640）
  #   在泳池留出集（120 帧 / 174 袋框，部署链路 cv2.dnn 实测，见 tools/verify_pool_model.py）：
  #     conf 0.35~0.70 → P 0.994 / R 0.925（tp 161 / fp 1 / fn 13），120/120 帧命中
  #     conf 0.80      → P 1.000 / R 0.908（fp 0），119/120 帧命中
  #   即"再抬到 0.80 能把这唯一的 1 个误检清掉，代价是丢 3 个真框 + 1 帧"。
  #   0.35 保留（落在精确率与召回都平坦的平台段）；若某次演示**必须零误抓**，
  #   可临时抬到 0.80 —— 改完记得用 verify_pool_model.py 复扫留出集确认。
  #
  #   ★ 这个模型还带真实照片识别能力（TACO val mAP50 0.369 / test 0.571，
  #   而纯合成版只有 0.003）—— 靠把 TACO 混进泳池微调（replay）换来的。
  #   实测教训：先 TACO 预训练、再只用合成域微调会**灾难性遗忘**（0.397 → 0.014）。
  #   ⚠ 换模型/换域（真机泳池实拍微调）之后必须用 verify_pool_model.py 重扫一次，
  #   别沿用旧模型的阈值结论。
  conf_threshold: 0.35
  iou_threshold: 0.45

  # ---------- 两个「类别」口径必须分开，否则会互相打架 ----------
  # classes：**标注口径**（作业台采集/标注时可选类别）。这里必须保留 buoy ——
  #          现场再训练时要把彩色浮标标成 buoy，它是抗干扰的负样本来源。
  classes: ["plastic_bag", "buoy"]
  # model_classes：**部署模型口径**（在用权重实际输出的类别，顺序即索引）。
  #          v20261015_190359 起部署的是「域内微调」2 类模型：plastic_bag 抓取目标
  #          + buoy 显式负类 —— 彩色浮标检出后按类名门控直接挡在抓取候选之外
  #          （抗彩色干扰第一道防线）。顺序即索引，改动必须与训练口径一致。
  model_classes: ["plastic_bag", "buoy"]
  # 只有目标类进入抓取候选；其余类别（浮标等）检出也不动手
  target_class: "plastic_bag"

data:
  root: "data"
  capture_frames: 200
  val_ratio: 0.2

# 作业台只读订阅平台派单，用于页面显示工单上下文（不改平台契约）
mqtt:
  enabled: true
  host: "localhost"
  port: 1883
  client_id: "oceanus_grasp_web"
  # ★ 与平台 backend/.env 的 robot_device 凭证一致
  username: "robot_device"
  password: "CHANGE_ME"
  keepalive: 30

agent:
  frame_period_ms: 250          # 视觉伺服周期：总线舵机慢，250ms 足够
  max_retry: 3                  # 单目标最大重试，超限上报异常
  grasp_depth_offset: 0.005     # 抓取点相对目标平面的下压量（m）
  # ★ 工作半径上限（m）。默认 0.20 在**室内地面**场景偏松：现场实测模型会把
  #   椅子/衣物认成袋子，而半径内的误检会被闭环真的去够（撞到东西）。
  #   现场实测的映射结果（当前标定下）：
  #     真袋子  像素(418,390) -> 世界(0.110, 0.000)  半径 0.110  ✅ 要抓
  #     右缘误检 像素(615,113) -> 世界(0.404, 0.416)  半径 0.580  ❌ 该拦
  #     上缘误检 像素(598, 22) -> 世界(0.379, 0.553)  半径 0.670  ❌ 该拦
  #   所以取 0.30：真袋子有 19cm 余量（袋子挪动也还在内），误检稳稳被拦。
  #   注：放置点不经过这个门（_place() 不检查），料槽在 ±0.275 不受影响。
  work_radius: 0.30
  approach_height: 0.08         # 接近点抬高量（m）
  # 目标锁定最少连续命中帧数（轨迹去抖）。默认 3；现场这个房间是域外场景，
  # 检测框帧间会跳（同一袋子在 (419,390) 与 (615,113) 之间切换），hit 计数
  # 被反复清零 → 3 帧永远凑不满。降到 2：误检已由 work_radius=0.30 兜住，
  # 这一层只需要滤掉单帧噪点。
  lock_min_hits: 2
  grip_stall_threshold: 8       # 「夹到东西」的脉宽停滞阈值
  # ============================================================
  # 图像误差驱动视觉伺服（③ 视觉伺服逼近）
  # ------------------------------------------------------------
  # ★ 为什么不再用标定的绝对坐标：现场实测那份单点标定的平移量偏了 —— 底座正
  #   前方的袋子被换算成「臂座后方 8cm」的不可达点，闭环第一次 move_to 直接被
  #   IK 拒掉（3 次尝试全在 1 秒内失败）。相机装在夹爪上，所以改为「把目标的
  #   grasp_point 推到画面目标像素」：像素偏差直接指示臂该往哪走多少，只借用
  #   标定的线性部分当雅可比，绝对位置逐帧收敛 —— 标定平移量漂了也不影响。
  # 理想落点（画面像素）。相机大致与夹爪同轴 → 取画面中心。
  servo_target_px: [320, 240]
  # 阻尼 + 单步上限：雅可比只是粗尺度（实测真值可能差数倍），靠这两项保证
  # 「尺度估偏了也不震荡发散」，用多迭代换收敛。
  servo_damping: 0.25
  servo_step_limit: 0.04        # 单步最大位移（m）
  servo_max_iters: 12           # 迭代上限
  servo_tol_px: 12              # 收敛判据：像素残差 |du|+|dv|
  servo_track_gate: 120         # 跟踪跳变门限（px）：超过就判"跟丢"
  # ★ 伺服机位相对「接近高度」再抬高多少（m）。必须抬高：低机位俯视时，相机
  #   自己的腕部/线缆就在画面里，模型会把它们也当塑料袋（实测 conf 0.85，还是
  #   全场最高）—— 那种目标随臂同步移动，伺服永远收敛不了。
  servo_lift: 0.15
  # 响应性判据：臂动了、目标像素却没按预期动（低于预期的 25%）→ 判为「固定在
  # 相机上的误检」放弃。仅当预期位移超过下面这个下限时才启用该判据（避开噪声）。
  servo_min_expected_px: 25
  # 兜底起点：标定估计不可达时退到这里（现场就是「底座正前方」一带）
  servo_fallback: [0.0, 0.10]
  # 伺服工作盒：伺服的唯一安全边界（不再受标定约束），臂不会为追误检出界
  servo_box:
    x: [-0.30, 0.30]
    y: [-0.05, 0.30]
  # ★ 抓取俯仰角（夹持器与水平面夹角，度；区间 [-180, 0]，-180 = 竖直朝下）。
  #   厂商在桌面/水面上抓取用 -175（warehouse/in.py、object_sorting/sorting.py），
  #   不是待命位的 -65。改成 -65 你会看到爪子斜着压不住目标。
  grasp_pitch: -175
  # ★ 抓取瞄准点：center=检测框中心（「夹最中间」）；mouth=袋口（框下沿略上，防滑脱）
  grasp_point_mode: "center"
  # ★ 识别前先把臂摆到俯视观测位（现场＝低头看水面）。识别与伺服用**同一机位**，
  #   否则会出现「在待命位锁定了、到伺服位却看不见目标」。
  observe_look_down: true

  # ============================================================
  # 放置点：把夹到的塑料袋放进「旁边那个料槽」（side_hopper）
  # ------------------------------------------------------------
  # 抓取点每帧都靠视觉现算，但**放置点是固定工位**（料槽装在臂座旁），
  # 所以只需给一次。几何默认值取自厂商 warehouse/in.py 的侧向货架
  # （x=±0.275、y=0、底层 z=0.02、俯仰 -130）—— 臂座两侧的料槽是同一类工位。
  # 两种给法二选一，coord 优先：
  #   coord —— 工作平面坐标 [x, y]（m，标定坐标系；原点由 9 点标定定义）
  #   pose  —— 示教舵机脉宽 {舵机ID: 0..1000}，直接回放该位姿
  #            现场示教最省事：作业台「手动点动」把臂摆到槽口上方 →
  #            点「用当前姿态作放置点」→ 写进 calibration.json。
  # ⚠️ 两个都为空时闭环**直接报错**「未配置料槽放置点」，不会把袋子随手
  #    丢在原地假装放好了 —— 「没放进去」和「放进去了」必须能区分。
  # 现场示教/输入的放置点写在 calibration.json（与设备绑定），
  # 这里的值只是兜底；重跑标定后需重新示教。
  place:
    coord: [0.275, 0.0]         # 右舷料槽（厂商货架同口径）；左舷填 [-0.275, 0.0]
    pose: null                  # 例：{1: 500, 2: 500, 3: 480, 4: 620, 5: 300, 6: 700}
    pitch: -130                 # 放置俯仰角（度）；厂商货架底层用 -130
    # ★ 高度必须是**绝对 z**（原点 = 臂座安装面）。现场实测目标平面（地面）
    #   在臂座下方 5cm，即 z=-0.05。所以：
    #     approach_z 0.05  槽口上方（略高于目标平面）
    #     drop_z    -0.06  松爪高度**必须落到平面以下一点**，否则爪子停在
    #                      袋子上面 7cm 就松爪，袋子原地不掉 —— 这是"以为放好了
    #                      其实没放"的高发点。真实情况与动画/默认值不同，别照抄。
    #     retreat_z  0.15  抬离高度（回到平面之上）
    approach_z: 0.05            # 槽口上方接近高度（**绝对 z**，m）
    drop_z: -0.06               # 松爪落料高度（**绝对 z**，m）
    retreat_z: 0.15             # 松爪后抬离高度（**绝对 z**，m）
    settle_s: 0.5               # 松爪后停顿：等袋子真的落进槽里再抬臂
    coord_move_ms: 900          # 槽口上方横移时长
    drop_move_ms: 700           # 下探 / 抬离时长

# ============================================================
# 常驻作业监督器（grasp/supervisor.py）
# ------------------------------------------------------------
# 为什么要有它：GraspLoop.run() 是「抓一个就收工」，两个既有入口（平台派单 /
# 作业台按钮）都是一次调一次。监督器在外面套一层循环，做成"开机后自己一直捡"。
# ⚠️ 与 arm_bridge 互斥：两者都会驱动同一台机械臂，同一时刻只能跑一个。
# ============================================================
supervisor:
  idle_interval_s: 5.0            # 视野里没目标时的轮询间隔
  cooldown_s: 3.0                 # 抓成功后的冷却（给放置/回位留时间）
  max_consecutive_failures: 5     # 连续失败到这个数就停并退出（由 systemd 决定是否重启）

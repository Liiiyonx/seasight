%% ===================================================================
%% Oceanus authorization rules (file-based, mounted into EMQX 5.8)
%% ===================================================================
%% Mounted to: /opt/emqx/etc/oceanus_acl.conf
%%
%% WHY ENGLISH-ONLY COMMENTS
%%   EMQX parses this file with erl_scan/erl_parse, which rejects:
%%     (a) non-ASCII characters -> {bad_acl_file_content,{2,erl_scan,{illegal,character}}}
%%     (b) lines starting with "#" (only "%%" is a comment) -> syntax error
%%   Both make the node refuse to boot. Verified 2026-10-05.
%%   -> Keep this file ASCII-only, comments prefixed with %%.
%%   -> Chinese explanations belong in docs/, not in this file.
%%
%% WHY {username, "name"} AND NOT A BARE STRING
%%   A bare "robot_device" is parsed as a client-match expression, not a
%%   username, and boot fails with:
%%     {invalid_client_match_condition, identifier => publish}
%%   Verified against the image's own /opt/emqx/etc/acl.conf, 2026-10-05.
%%
%% RULE ORDER MATTERS
%%   Rules are evaluated top to bottom, first match wins. Each block
%%   therefore starts with a blanket deny, then carves out exceptions.
%%
%% SYNTAX
%%   {action, who, access, [resources]}.
%%     action    : allow | deny
%%     who       : all | {username, {re, "^name$"}}
%%     access    : publish | subscribe | all
%%     resources : list of topic filters (+ one level, # rest)

%% --- backend service: full read/write ---
{allow, {username, {re, "^backend_service$"}}, all, ["#"]}.
{allow, {username, {re, "^seasight$"}},        all, ["#"]}.

%% arm bridge (robot_device)
%% ★ ALL allow rules for this account must appear BEFORE its blanket deny
%%   (first match wins). I first appended a second block for a self-test
%%   device id after the deny -- it was silently never reached, and the
%%   symptom looked like "the broker refuses everything". Keep one block,
%%   allow first, deny last.
{allow, {username, {re, "^robot_device$"}}, subscribe, ["robot/RBT-001/task"]}.
{allow, {username, {re, "^robot_device$"}}, subscribe, ["robot/RBT-001/cmd"]}.
{allow, {username, {re, "^robot_device$"}}, publish,   ["robot/RBT-001/cmd/ack"]}.
{allow, {username, {re, "^robot_device$"}}, publish,   ["robot/RBT-001/task/progress"]}.
{allow, {username, {re, "^robot_device$"}}, publish,   ["marine/lianjiang/RBT-001/telemetry"]}.
{allow, {username, {re, "^robot_device$"}}, publish,   ["marine/lianjiang/RBT-001/status"]}.
%% spare device id used only by scripts/selftest_bridge_loop.py
{allow, {username, {re, "^robot_device$"}}, subscribe, ["robot/SELFTEST/task"]}.
{allow, {username, {re, "^robot_device$"}}, subscribe, ["robot/SELFTEST/cmd"]}.
{allow, {username, {re, "^robot_device$"}}, publish,   ["robot/SELFTEST/cmd/ack"]}.
{allow, {username, {re, "^robot_device$"}}, publish,   ["robot/SELFTEST/task/progress"]}.
{allow, {username, {re, "^robot_device$"}}, publish,   ["marine/lianjiang/SELFTEST/telemetry"]}.
{allow, {username, {re, "^robot_device$"}}, publish,   ["marine/lianjiang/SELFTEST/status"]}.
{deny,  {username, {re, "^robot_device$"}}, all, ["#"]}.

%% edge perception devices: publish telemetry/status only
{allow, {username, {re, "^edge_device$"}}, publish,   ["marine/+/+/telemetry"]}.
{allow, {username, {re, "^edge_device$"}}, publish,   ["marine/+/+/status"]}.
{allow, {username, {re, "^edge_device$"}}, subscribe, ["marine/+/+/cmd"]}.
{deny,  {username, {re, "^edge_device$"}}, all, ["#"]}.

%% read-only observer: telemetry subscribe only
{allow, {username, {re, "^dashboard_viewer$"}}, subscribe, ["marine/+/+/telemetry"]}.
{allow, {username, {re, "^dashboard_viewer$"}}, subscribe, ["marine/+/+/status"]}.
{allow, {username, {re, "^dashboard_viewer$"}}, subscribe, ["robot/+/task/progress"]}.
{allow, {username, {re, "^dashboard_viewer$"}}, subscribe, ["robot/+/cmd/ack"]}.
{deny,  {username, {re, "^dashboard_viewer$"}}, all, ["#"]}.

# ===================================================================
# EMQX MQTT-over-WebSocket 的 upstream（2026-10-05 线上实测后修正）
# ===================================================================
# ★ 装在 **http 块**（放 conf.d/*.conf，由 nginx.conf 的
#   `include /etc/nginx/conf.d/*.conf` 引入）—— 放进 server 块会报
#   "upstream" directive is not allowed here。
#
# ★ 为什么用 127.0.0.1:8083 而不是容器名 emqx:8083
#   nginx 是**宿主进程**，不在 Docker 网络里，解析不到容器名，
#   报 "host not found in upstream"（2026-10-05 线上实测）。
#   容器 IP（如 172.18.0.4）虽然宿主可达，但**容器重建后会变** ——
#   硬编码 IP 同样是隐患。
#   正解：docker-compose 里把 8083 映射到宿主回环（只绑 127.0.0.1，
#   公网仍只能走 443，与"只开 80/443"的口径一致），upstream 指它。
#
# 线上验证：容器内 curl WS 握手 HTTP 101 → nginx 转发 HTTP 101 →
#           公网 <ECS_HOST>:443 带认证 CONNACK=0。
upstream emqx_ws {
    server 127.0.0.1:8083;
}

# ======================================================================
# SeaSight host Nginx (production/pilot)
#
# Deploy to /etc/nginx/conf.d/seasight.conf.
# The Compose frontend container already serves the SPA and proxies /api,
# /stream, /health and /ready internally. This layer terminates public HTTP
# traffic and proxies only to the loopback-bound frontend port.
#
# Usage:
#   sudo cp deploy/nginx/seasight.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
# ======================================================================

upstream seasight_frontend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# If a trusted SLB/WAF sits in front of this host, uncomment and set its
# network ranges so application logs retain the original client address.
# set_real_ip_from 10.0.0.0/8;
# real_ip_header X-Forwarded-For;

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket routes must be more specific than the SPA fallback. The token
    # is carried in the query string, so access logging is disabled here.
    location = /api/v1/ws/alerts {
        access_log off;
        proxy_pass http://seasight_frontend;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Long-lived FLV/WebRTC streams must not be buffered by the outer proxy.
    location /stream/ {
        proxy_pass http://seasight_frontend;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Everything else goes through the frontend container's Nginx. It owns
    # SPA fallback, static caching, API proxying, and health endpoints.
    location / {
        proxy_pass http://seasight_frontend;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ~ /\.(git|env|svn|DS_Store) {
        deny all;
        return 404;
    }
}


# ===================================================================
# MQTT over WebSocket 反向代理（机械臂路演通道）
# ===================================================================
# 安装：并入已有 HTTPS server 块的 include 列表，不要新建 server 块
#   （宿主机上聆心共用同一个 443）。
#
#   sudo cp deploy/nginx/mqtt-websocket.conf /etc/nginx/snippets/mqtt-ws.conf
#   # 在 443 server 块里加：
#   include /etc/nginx/snippets/mqtt-ws.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# 为什么需要（云端 EMQX 的 1883 绑 127.0.0.1，是正确的安全设计；
# 而路演现场设备只能走 HTTPS/WSS，开不了 1883）。
#
# upstream 定义见同目录 emqx-upstream.conf（必须放 http 块）。
# ★ EMQX 5.8 的 WS 监听**要求子协议 Sec-WebSocket-Protocol: mqtt**，
#   缺了返回 HTTP 400（路径对也拒绝）。设备侧已在 _ws_opts() 带上该头。
# ★ 证书是共享域名的自签证书，设备侧用 tls_insecure_set(True) 放行。
location /mqtt {
    proxy_pass http://emqx_ws;

    # WebSocket 升级必需的三件套
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 设备 keepalive 60s，但 WS 长连接要放宽读超时
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    add_header Access-Control-Allow-Origin "*" always;
}

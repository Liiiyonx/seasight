# Alembic main configuration -- SeaSight
#
# NOTE: This file is intentionally ASCII ONLY.
#
# Reason: Alembic reads .ini files with a hardcoded encoding="locale"
# (see alembic/util/compat.py).  On Chinese Windows that resolves to
# cp936 (GBK), so ANY non-ASCII byte in this file makes every `alembic`
# subcommand die with:
#
#     UnicodeDecodeError: 'gbk' codec can't decode byte 0x80 ...
#
# HISTORY (integration fix, 2026-09-19, controller):
#   The config used to live in [tool.alembic] of pyproject.toml, on the
#   theory that Alembic reads TOML in binary mode via tomllib.  That is
#   WRONG for Alembic 1.14: Alembic does NOT auto-discover pyproject.toml,
#   and `alembic -c pyproject.toml` still reads the file through
#   configparser with encoding="locale" (GBK), so any Chinese byte in
#   pyproject.toml crashes every subcommand.  Independently reproduced.
#   Therefore this file is now the SINGLE source of the [alembic] config
#   (ASCII only).  The [tool.alembic] section in pyproject.toml is
#   deprecated/inert and must not be relied on.
#
# The database URL is NOT stored here (this file is committed to git).
# alembic/env.py injects settings.database_url_sync at runtime.
#
# Logging sections below are consumed by fileConfig() in alembic/env.py.
#
# >>> Do NOT add non-ASCII characters below this line. <<<

[alembic]
script_location = alembic
version_locations = %(here)s/alembic/versions
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = Asia/Shanghai
truncate_slug_length = 40
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
